<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Всі екзаменаційні маршрути МВС | ТСЦ 2641</title>
    <link rel="icon" type="image/png" href="img/logo.jpg">
    <link rel="stylesheet" href="welcome.css">
  <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #05050a;
        }
        #app-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Кнопка зміни фону у лівому кутку */
        .bg-change-container {
            position: fixed;
            top: 16px;
            left: 20px;
            z-index: 10000;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            gap: 8px;
        }

        /* Селектор мови у правому кутку */
        .language-selector-container {
            position: fixed;
            top: 16px;
            right: 20px;
            z-index: 10000;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        /* Преміальний неоновий стиль для обох кнопок */
        .bg-btn, .lang-btn {
            background: linear-gradient(145deg, rgba(20, 24, 42, 0.92), rgba(10, 12, 22, 0.96));
            color: #d0dcff;
            border: 1px solid rgba(0, 243, 255, 0.35);
            padding: 9px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13.5px;
            letter-spacing: 0.4px;
            backdrop-filter: blur(12px);
            transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6), inset 0 0 10px rgba(0, 243, 255, 0.08);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .bg-btn:hover, .lang-btn:hover {
            background: linear-gradient(145deg, rgba(35, 20, 58, 0.95), rgba(16, 22, 42, 0.95));
            color: #ffffff;
            border-color: #ff00e5;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 229, 0.4), 0 0 15px rgba(0, 243, 255, 0.35), inset 0 0 12px rgba(255, 0, 229, 0.2);
        }

        /* Випадаючий список мов у стилі Cyberpunk Glass */
        .lang-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 46px;
            background: linear-gradient(180deg, rgba(14, 17, 32, 0.96) 0%, rgba(8, 10, 20, 0.98) 100%);
            border: 1px solid rgba(0, 243, 255, 0.4);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 243, 255, 0.2);
            overflow: hidden;
            min-width: 170px;
            backdrop-filter: blur(16px);
            max-height: 320px;
            overflow-y: auto;
        }
        .lang-dropdown.show {
            display: block;
        }
        .lang-option {
            width: 100%;
            padding: 10px 16px;
            background: none;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #d0dcff;
            text-align: left;
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .lang-option:last-child {
            border-bottom: none;
        }
        .lang-option:hover {
            background: linear-gradient(90deg, rgba(0, 243, 255, 0.2), rgba(255, 0, 229, 0.2));
            color: #ffffff;
            padding-left: 20px;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.8);
        }
    </style>
</head>
<body>

   <!-- Кнопки зміни та скидання фону у лівому кутку -->
   <div class="bg-change-container">
       <label class="bg-btn" id="bg-upload-btn">
           🖼️ Змінити фон
           <input type="file" id="bgFileInput" accept="image/*" style="display: none;" onchange="changeCustomBackground(event)">
       </label>
       <button class="bg-btn" id="bg-reset-btn" onclick="resetCustomBackground()" style="display: none; background: rgba(211, 47, 47, 0.8);">
           🔄 Скинути
       </button>
   </div>

   <!-- Вибір мови у правому кутку -->
   <div class="language-selector-container">
       <button class="lang-btn" id="lang-menu-btn" onclick="toggleLangDropdown(event)">🌐 Мова / Language</button>
       <div class="lang-dropdown" id="lang-dropdown-menu">
           <button class="lang-option" onclick="changeLanguage('uk')">🇺🇦 Українська</button>
           <button class="lang-option" onclick="changeLanguage('en')">🇬🇧 English</button>
           <button class="lang-option" onclick="changeLanguage('pl')">🇵🇱 Polski</button>
           <button class="lang-option" onclick="changeLanguage('de')">🇩🇪 Deutsch</button>
           <button class="lang-option" onclick="changeLanguage('zh')">🇨🇳 中文</button>
           <button class="lang-option" onclick="changeLanguage('hu')">🇭🇺 Magyar</button>
           <button class="lang-option" onclick="changeLanguage('ro')">🇷🇴 Română</button>
       </div>
   </div>

    <!-- Головна картка входу -->
    <div id="welcome-screen">
        <div class="welcome-card">
            <h1>🏎️ DriveSync-Frankivsk</h1>
            <p id="welcome-desc">Івано-Франківськ — Екзаменаційні маршрути МВС та розбори DEMICH</p>
            
            <button class="btn-google" id="googleAuthBtn" onclick="handleGoogleAuth()" style="display: flex; align-items: center; justify-content: center; gap: 10px; background: #ffffff; color: #333; border: 1px solid #ccc; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; margin-bottom: 12px;">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" width="20">
                <span id="google-btn-text">Зареєструватися / Увійти</span>
            </button>

            <button id="enter-btn" onclick="enterApp()" disabled style="opacity: 0.5; cursor: not-allowed; width: 100%;">🎟️ Увійти</button>
        </div>
    </div>

    <!-- Модальне вікно введення пошти та пароля -->
    <div id="authChoiceModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 10002;">
        <div style="background: #1e1e1e; color: #fff; padding: 25px; border-radius: 12px; max-width: 380px; width: 90%; text-align: center; border: 1px solid #444;">
            <h3 style="margin-top:0; color: #00E676;">Авторизація</h3>
            <p style="font-size: 0.85rem; color: #aaa; margin-bottom: 20px;">Введіть ваш Email та пароль для входу:</p>

            <div id="loginErrorMsg" style="display: none; color: #ff5252; font-size: 0.85rem; font-weight: bold; margin-bottom: 10px;"></div>

            <form onsubmit="handleManualLogin(event)" style="display: flex; flex-direction: column; gap: 12px;">
                <input type="email" id="manualEmail" placeholder="Введіть ваш Email" required style="padding: 12px; background: #2b2b2b; border: 1px solid #444; color: #fff; border-radius: 6px; outline: none; box-sizing: border-box;">
                <input type="password" id="manualPass" placeholder="Пароль" required style="padding: 12px; background: #2b2b2b; border: 1px solid #444; color: #fff; border-radius: 6px; outline: none; box-sizing: border-box;">
                <button type="submit" style="background: #00E676; color: #000; font-weight: bold; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.95rem; margin-top: 5px;">Увійти за Email</button>
            </form>

            <button onclick="closeAuthChoiceModal()" style="margin-top: 15px; background: none; border: none; color: #888; cursor: pointer; text-decoration: underline; font-size: 0.85rem;">Скасувати</button>
        </div>
    </div>

    <!-- Модальне вікно про збереження акаунту -->
    <div id="rememberModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); align-items: center; justify-content: center; z-index: 10003;">
        <div style="background: #1e1e1e; color: #fff; padding: 25px; border-radius: 12px; max-width: 380px; width: 90%; text-align: center; border: 1px solid #444;">
            <h3 id="modal-save-title" style="margin-top: 0; color: #00E676;">Зберегти акаунт?</h3>
            <p id="modal-save-desc" style="font-size: 0.9rem; color: #ccc;">Бажаєте зберегти ваші дані у цьому браузері, щоб не уводити їх наново при наступному вході?</p>
            <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
                <button onclick="confirmRemember(true)" style="background: #00E676; color: #000; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer;" id="btn-yes-save">Так, зберегти</button>
                <button onclick="confirmRemember(false)" style="background: #444; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer;" id="btn-no-save">Ні, дякую</button>
            </div>
        </div>
    </div>

    <iframe id="app-frame" src="index.html"></iframe>

    <script src="welcome_new.js"></script>

    <script>
        function changeCustomBackground(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const bgUrl = e.target.result;
                applyBackground(bgUrl);
                try {
                    localStorage.setItem('drivesync_custom_bg', bgUrl);
                } catch(err) {}
            };
            reader.readAsDataURL(file);
        }

        function applyBackground(bgUrl) {
            const welcomeScreen = document.getElementById('welcome-screen');
            if (welcomeScreen) {
                welcomeScreen.style.backgroundImage = `linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.4)), url('${bgUrl}')`;
            }

            const resetBtn = document.getElementById('bg-reset-btn');
            if (resetBtn) resetBtn.style.display = 'inline-block';

            try {
                const iframe = document.getElementById('app-frame');
                if (iframe && iframe.contentWindow && iframe.contentWindow.document) {
                    iframe.contentWindow.document.body.style.backgroundImage = `url('${bgUrl}')`;
                }
            } catch(e) {}
        }

        function resetCustomBackground() {
            localStorage.removeItem('drivesync_custom_bg');
            const welcomeScreen = document.getElementById('welcome-screen');
            if (welcomeScreen) {
                welcomeScreen.style.backgroundImage = "linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.4)), url('img/welfon.jpg')";
            }

            const resetBtn = document.getElementById('bg-reset-btn');
            if (resetBtn) resetBtn.style.display = 'none';

            const fileInput = document.getElementById('bgFileInput');
            if (fileInput) fileInput.value = '';

            try {
                const iframe = document.getElementById('app-frame');
                if (iframe && iframe.contentWindow && iframe.contentWindow.document) {
                    iframe.contentWindow.document.body.style.backgroundImage = "url('img/fon.jpg')";
                }
            } catch(e) {}
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedBg = localStorage.getItem('drivesync_custom_bg');
            if (savedBg) {
                applyBackground(savedBg);
            }
        });

        function toggleLangDropdown(event) {
            event.stopPropagation();
            const dropdown = document.getElementById('lang-dropdown-menu');
            dropdown.classList.toggle('show');
        }

        window.addEventListener('click', function() {
            const dropdown = document.getElementById('lang-dropdown-menu');
            if (dropdown && dropdown.classList.contains('show')) {
                dropdown.classList.remove('show');
            }
        });

        const translations = {
            uk: { desc: 'Івано-Франківськ — Екзаменаційні маршрути МВС та розбори DEMICH', enter: '🎟️ Увійти', saveTitle: 'Зберегти акаунт?', saveDesc: 'Бажаєте зберегти ваші дані у цьому браузері, щоб не уводити їх наново при наступному вході?', yes: 'Так, зберегти', no: 'Ні, дякую', bgBtn: '🖼️ Змінити фон', bgReset: '🔄 Скинути' },
            en: { desc: 'Ivano-Frankivsk — Ministry of Internal Affairs Exam Routes & DEMICH Reviews', enter: '🎟️ Enter', saveTitle: 'Save account?', saveDesc: 'Do you want to save your data in this browser so you don\'t have to log in again next time?', yes: 'Yes, save', no: 'No, thanks', bgBtn: '🖼️ Change BG', bgReset: '🔄 Reset' },
            pl: { desc: 'Iwano-Frankiwsk — Trasy egzaminacyjne MSW i analiza DEMICH', enter: '🎟️ Wejdź', saveTitle: 'Zapisać konto?', saveDesc: 'Czy chcesz zapisać swoje dane w tej przeglądarce, aby nie logować się ponownie następnym razem?', yes: 'Tak, zapisz', no: 'Nie, dziękuję', bgBtn: '🖼️ Zmień tło', bgReset: '🔄 Resetuj' },
            de: { desc: 'Iwano-Frankiwsk — MWD-Prüfungsstrecken & DEMICH Analysen', enter: '🎟️ Betreten', saveTitle: 'Konto speichern?', saveDesc: 'Möchten Sie Ihre Daten in diesem Browser speichern, um sich beim nächsten Mal nicht erneut anmelden zu müssen?', yes: 'Ja, speichern', no: 'Nein, danke', bgBtn: '🖼️ Hintergrund ändern', bgReset: '🔄 Zurücksetzen' },
            zh: { desc: '伊万-弗兰科夫斯克 — 内政部考试路线与 DEMICH 评测', enter: '🎟️ 进入', saveTitle: '保存账户？', saveDesc: '您想在此浏览器中保存您的数据，以便下次无需重新登录吗？', yes: '是的，保存', no: '不用了，谢谢', bgBtn: '🖼️ 更换背景', bgReset: '🔄 重置' },
            hu: { desc: 'Ivano-Frankivszk — Belügyminisztérium vizsgútvonalak és DEMICH elemzések', enter: '🎟️ Belépés', saveTitle: 'Fiók mentése?', saveDesc: 'Szeretné elmenteni adatait ebben a böngészőben, hogy legközelebb ne kelljen újra bejelentkeznie?', yes: 'Igen, mentés', no: 'Nem, köszönöm', bgBtn: '🖼️ Háttér módosítása', bgReset: '🔄 Visszaállítás' },
            ro: { desc: 'Ivano-Frankivsk — Trasee de examen MAI și recenzii DEMICH', enter: '🎟️ Intră', saveTitle: 'Salvați contul?', saveDesc: 'Doriți să vă salvați datele în acest browser pentru a nu fi nevoit să vă autentificați din nou data viitoare?', yes: 'Da, salvează', no: 'Nu, mulțumesc', bgBtn: '🖼️ Schimbă fundalul', bgReset: '🔄 Resetează' }
        };

        function changeLanguage(lang) {
            localStorage.setItem('selected_lang', lang);
            
            const desc = document.getElementById('welcome-desc');
            const enterBtn = document.getElementById('enter-btn');
            const saveTitle = document.getElementById('modal-save-title');
            const saveDesc = document.getElementById('modal-save-desc');
            const btnYes = document.getElementById('btn-yes-save');
            const btnNo = document.getElementById('btn-no-save');
            const bgUploadBtn = document.getElementById('bg-upload-btn');
            const bgResetBtn = document.getElementById('bg-reset-btn');
            
            if (translations[lang]) {
                if (desc) desc.innerText = translations[lang].desc;
                if (enterBtn && !enterBtn.disabled) enterBtn.innerText = translations[lang].enter;
                if (saveTitle) saveTitle.innerText = translations[lang].saveTitle;
                if (saveDesc) saveDesc.innerText = translations[lang].saveDesc;
                if (btnYes) btnYes.innerText = translations[lang].yes;
                if (btnNo) btnNo.innerText = translations[lang].no;
                if (bgUploadBtn) bgUploadBtn.innerHTML = `${translations[lang].bgBtn} <input type="file" id="bgFileInput" accept="image/*" style="display: none;" onchange="changeCustomBackground(event)">`;
                if (bgResetBtn) bgResetBtn.innerText = translations[lang].bgReset;
            }

            if (typeof updateAuthStateUI === 'function') {
                updateAuthStateUI();
            }

            const iframe = document.getElementById('app-frame');
            if (iframe) {
                let currentSrc = iframe.src.split('?')[0];
                iframe.src = currentSrc + '?lang=' + lang;
            }
        }

        const iframe = document.getElementById('app-frame');
        iframe.onload = function() {
            addNavigationButtons();
            const savedBg = localStorage.getItem('drivesync_custom_bg');
            if (savedBg) {
                try {
                    iframe.contentWindow.document.body.style.backgroundImage = `url('${savedBg}')`;
                } catch(e) {}
            }
        };

        function addNavigationButtons() {
            try {
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                const savedLang = localStorage.getItem('selected_lang') || 'uk';
                
                const streetBtnTexts = {
                    uk: '📋 Вулиці маршрутів',
                    en: '📋 Route Streets',
                    pl: '📋 Ulice tras',
                    de: '📋 Routenstraßen',
                    zh: '📋 路线街道',
                    hu: '📋 Útvonalak utcái',
                    ro: '📋 Străzile traseului'
                };

                const carBtnTexts = {
                    uk: '🚗 Авто МВС',
                    en: '🚗 MIA Cars',
                    pl: '🚗 Samochody MSW',
                    de: '🚗 MWD-Autos',
                    zh: '🚗 内政部汽车',
                    hu: '🚗 BM autók',
                    ro: '🚗 Mașini MAI'
                };

                // 1. Кнопка Вулиці
                let btnStreets = iframeDoc.getElementById('custom-streets-btn');
                if (!btnStreets) {
                    const firstBtn = iframeDoc.querySelector('.nav-btn') || iframeDoc.querySelector('.nav-buttons button:last-child');
                    if (firstBtn && firstBtn.parentElement) {
                        btnStreets = document.createElement('button');
                        btnStreets.id = 'custom-streets-btn';
                        btnStreets.className = 'nav-btn';
                        btnStreets.onclick = function() {
                            window.location.href = 'streets.html?lang=' + savedLang;
                        };
                        firstBtn.parentElement.appendChild(btnStreets);
                    }
                }
                if (btnStreets) {
                    btnStreets.innerText = streetBtnTexts[savedLang] || streetBtnTexts.uk;
                }

                // 2. Кнопка Авто МВС (BeamNG Style)
                let btnCars = iframeDoc.getElementById('custom-cars-btn');
                if (!btnCars) {
                    const container = iframeDoc.querySelector('.nav-buttons');
                    if (container) {
                        btnCars = document.createElement('button');
                        btnCars.id = 'custom-cars-btn';
                        btnCars.className = 'nav-btn';
                        btnCars.style.background = '#2a1f18';
                        btnCars.style.borderColor = '#ff6600';
                        btnCars.style.color = '#ff6600';
                        btnCars.onclick = function() {
                            window.location.href = 'cars.html?lang=' + savedLang;
                        };
                        container.appendChild(btnCars);
                    }
                }
                if (btnCars) {
                    btnCars.innerText = carBtnTexts[savedLang] || carBtnTexts.uk;
                }

            } catch (e) {}
        }
    </script>
</body>
</html>
