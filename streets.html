        function showStreets() {
            const selectedRoute = document.getElementById('routeSelect').value;
            const ul = document.getElementById('streetsUl');
            ul.innerHTML = "";

            const urlParams = new URLSearchParams(window.location.search);
            let lang = urlParams.get('lang') || localStorage.getItem('selected_lang') || 'uk';
            if (!routesData[lang]) lang = 'uk';

            const streets = routesData[lang][selectedRoute] || ["Information is missing."];
            
            streets.forEach(street => {
                const li = document.createElement('li');
                li.innerText = street;
                ul.appendChild(li);
            });
        }

        const streetTranslations = {
            uk: { title: "🚗 Всі екзаменаційні маршрути МВС", sub: "ТСЦ № 2641 (м. Івано-Франківськ) — Відео-розбори DEMICH", h2: "📋 Список вулиць по екзаменаційних маршрутах", b1: "🗺️ Карта (Малювання)", b2: "📍 Маршрути МВС та Відео", b3: "📋 Список і Чек-лист", b4: "📋 Вулиці маршрутів", routeWord: "Маршрут №" },
            en: { title: "🚗 All MIA Exam Routes", sub: "TSC № 2641 (Ivano-Frankivsk) — DEMICH Reviews", h2: "📋 Street List by Exam Routes", b1: "🗺️ Map (Drawing)", b2: "📍 MIA Routes & Video", b3: "📋 List & Checklist", b4: "📋 Route Streets", routeWord: "Route №" },

            const urlParams = new URLSearchParams(window.location.search);
            let lang = urlParams.get('lang') || localStorage.getItem('selected_lang') || 'uk';
            const t = streetTranslations[lang];

            if (t) {
                const h1 = document.querySelector('header h1');
                const p = document.querySelector('header p');
                const h2 = document.getElementById('streets-header');
                const b1 = document.getElementById('s-btn-1');
                const b2 = document.getElementById('s-btn-2');
                const b3 = document.getElementById('s-btn-3');
                const b4 = document.getElementById('s-btn-4');

                if (h1) h1.innerText = t.title;
                if (p) p.innerText = t.sub;
                if (h2) h2.innerText = t.h2;
                if (b1) b1.innerText = t.b1;
                if (b2) b2.innerText = t.b2;
                if (b3) b3.innerText = t.b3;
                if (b4) b4.innerText = t.b4;

                const sel = document.getElementById('routeSelect');
                if (sel) {
                    Array.from(sel.options).forEach(opt => {
                        const val = opt.value;
                        opt.text = `${t.routeWord}${val}`;
                    });
                }
            }

            showStreets();
        });
