<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список вулиць по маршрутах | ТСЦ 2641</title>
    <link rel="icon" type="image/png" href="img/logo.jpg">
    <link rel="stylesheet" href="style-streets.css">
</head>
<body>

    <!-- Верхня шапка -->
    <header>
        <h1>🚗 Всі екзаменаційні маршрути МВС</h1>
        <p>ТСЦ № 2641 (м. Івано-Франківськ) — Відео-розбори DEMICH</p>
    </header>

    <!-- Повне меню з 4 кнопками, як на інших сторінках -->
    <div class="nav-buttons">
        <button onclick="location.href='index.html?view=map'">🗺️ Карта (Малювання)</button>
        <button onclick="location.href='index.html?view=my-routes'">📍 Маршрути МВС та Відео</button>
        <button onclick="location.href='index.html?view=list'">📋 Список і Чек-лист</button>
        <button class="active">📋 Вулиці маршрутів</button>
    </div>

    <div class="container">
        <h2>📋 Список вулиць по екзаменаційних маршрутах</h2>
        
        <select id="routeSelect" onchange="showStreets()">
            <option value="1">Маршрут №1 (Дудаєва)</option>
            <option value="2">Маршрут №2 (Незалежності)</option>
            <option value="3">Маршрут №3 (Сахарова)</option>
            <option value="4">Маршрут №4 (Довженка)</option>
            <option value="6">Маршрут №6 (Вокзал)</option>
            <option value="7">Маршрут №7 (Стецького)</option>
            <option value="8">Маршрут №8 (Микитинці )</option>
            <option value="9">Маршрут №9 (Вокзал)</option>
            <option value="10">Маршрут №10 (Сухомлицького)</option>
            <option value="11">Маршрут №11 (Довженка)</option>
        </select>

        <div id="streetsListContainer">
            <ol id="streetsUl">
                <!-- Сюди підтягуватимуться вулиці з нумерацією -->
            </ol>
        </div>
    </div>

    <script>
        const routesData = {
            "1": [
                "вул. Коновальця(Старт біля ТСЦ МВС)",
                "вул. Джохара Дудаєва",
                "Розворот у кінці вулиці",
                "Зворотний шлях до ТСЦ МВС"
            ],
            "2": [
                "вул.Коновальця (Старт МВС)",
                "вул. Бандери",
                "вул. Височана",
                "вул. Шухевича",
                "вул. Незалжності",
                "вул. Бандери",
                "Повернення до сервісного центру "
            ],
            "3": [
                "вул. Коновальця(Старт МВС)",
                "вул. Бандери ",
                "вул. Сахарова ",
                "вул. Коновальця ",
                " повернення до МВС"
            ],
            "4": [
                "вул. Коновальця (Старт МВС)",
                "вул. Петлюри",
                "вул. Довженка ",
                "по колці на 4 зїзд ",
                "Зворотний маршрут до МВС"
            ],
            "6": [
                "вул. Коновальця (Старт МВС)",
                "вул. Бандери",
                "вул. Височана",
                "вул. Шухевича",
                "вул. Незалежності",
                "вул. Залізчна",
                "вул. Лепкого",
                "вул. Незалежності ",
                "вул. Мельника",
                "вул. Мельника ",
                "вул. Сахарова ",
                "вул. Коновальця",
                "Повернення до сервісного центру"
            ],
            "7": [
                "вул. Коновальця(Старт біля МВС)",
                "вул. Бандери",
                "вул. Стецького",
                "вул. Коновальця",
                "Фініш біля ТСЦ МВС"
            ],
            "8": [
                "вул. Коновальця (Старт МВС)",
                "вул. Бандери",
                "вул. Ребета",
                "вул. Макуха",
                "вул. Микитиньська",
                "вул. Незалежності ",
                "вул. Юності ",
                "Повернення до сервісного центру"
            ],
            "9": [
                "вул. Коновальця (Старт МВС)",
                "вул. Сахарова",
                "вул. Мельника",
                "вул. Незалежності",
                "вул. Лепкого",
                "вул. Залізнична",
                "вул. Незалежності",
                "вул. Шухевичів",
                "вул. Височана",
                "вул. Зорія",
                "вул. Бандери",
                "Повернення до сервісного центру"
            ],
            "10": [
                "вул. Коновальця(Старт МВС)",
                "вул.Петлюри ",
                "вул. Дорошенка",
                "вул. Сухомлицького",
                "вул. Довженка",
                "Зворотний шлях до МВС"
            ],
            "11" :[
                "вул. Коновальця (Старт МВС)",
                "вул. Петлюри до кільця",
                "Поверненя на сервісний центер МВС"
            ]
        };

        function showStreets() {
            const selectedRoute = document.getElementById('routeSelect').value;
            const ul = document.getElementById('streetsUl');
            ul.innerHTML = "";

            const streets = routesData[selectedRoute] || ["Інформація про цей маршрут поки відсутня."];
            
            streets.forEach(street => {
                const li = document.createElement('li');
                li.innerText = street;
                ul.appendChild(li);
            });
        }

        showStreets();
    </script>

</body>
</html>
