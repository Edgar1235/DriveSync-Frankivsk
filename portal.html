<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Всі екзаменаційні маршрути МВС | ТСЦ 2641</title>
    <link rel="icon" type="image/png" href="img/logo.jpg">
    <!-- Підключаємо окремі стилі екрана привітання -->
    <link rel="stylesheet" href="welcome.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1e1e1e;
        }
        #app-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

   <!-- Екран привітання (головне меню) -->
    <div id="welcome-screen">
        <div class="welcome-card">
            <h1>🚗 DriveSync-Frankivsk</h1>
            <p>Івано-Франківськ — Екзаменаційні маршрути МВС та розбори DEMICH</p>
            <button id="enter-btn">🚀 Увійти </button>
        </div>
    </div>

    <!-- Вікно з додатком -->
    <iframe id="app-frame" src="index.html"></iframe>

    <!-- Підключаємо окрему логіку екрана привітання -->
    <script src="welcome.js"></script>

    <script>
        const iframe = document.getElementById('app-frame');
        
        function addStreetButton() {
            try {
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                
                // Перевіряємо, чи кнопка вже додана, щоб не дублювати
                if (iframeDoc.getElementById('custom-streets-btn')) return;

                // Шукаємо батьківський блок існуючих кнопок меню
                const firstBtn = iframeDoc.querySelector('.nav-btn');
                if (firstBtn) {
                    const menuContainer = firstBtn.parentElement; 
                    
                    if (menuContainer) {
                        // Створюємо кнопку "Вулиці маршрутів"
                        const streetsBtn = document.createElement('button');
                        streetsBtn.id = 'custom-streets-btn';
                        streetsBtn.className = 'nav-btn'; // Той самий клас, що й у старих кнопок
                        streetsBtn.style.backgroundColor = '#17a2b8'; // Блакитний колір
                        streetsBtn.style.color = 'white';
                        streetsBtn.innerText = '📋 Вулиці маршрутів';
                        
                        streetsBtn.onclick = function() {
                            window.location.href = 'streets.html';
                        };
                        
                        // Додаємо в кінець панелі меню
                        menuContainer.appendChild(streetsBtn);
                    }
                }
            } catch (e) {
                console.log("Помилка додавання кнопки:", e);
            }
        }

        // Слідкуємо за завантаженням та змінами в iframe
        iframe.onload = addStreetButton;
        setInterval(addStreetButton, 500);
    </script>

</body>
</html>
